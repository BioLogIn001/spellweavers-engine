[build-system]
requires = ["flit_core>=4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "spellweavers"
version = "2026.10.1"
description = "Engine for Spellbinder / Waving Hands style duels"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE.md"]

[dependency-groups]
dev = ["pytest", "mypy", "ruff==0.17.3"]

[tool.pytest.ini_options]
python_files = ["tests_*.py"]

[tool.mypy]
python_version = "3.12"
# ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disable_error_code = ["attr-defined", "union-attr", "override"]  # #74: union-attr -> phase 3, override -> phase 4, attr-defined -> phase 2

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
]

[tool.ruff.lint.per-file-ignores]
"tests_*/*" = ["F841"]  # unused actor lookups in tests
